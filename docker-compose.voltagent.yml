# Real VoltAgent Governed Integration — one-command end-to-end stack.
#
#   scripts/compose_agents_e2e.sh docker-compose.voltagent.yml \
#       "mcc-gateway evaluator-quorum voltagent-operator" \
#       "voltagent-agent voltagent-agent-unknown"
#
# Flow:
#   redis              Redis-backed nonce/idempotency/velocity/approval/challenge.
#   mock-notification  the external service the notification is delivered to.
#   mcc-gateway        MCC-Core: authority + decision token + execution gate +
#                      coordinator + audit + the receipt-verifying governed executor
#                      (EXECUTED only on a confirmed matching receipt). Consensus on.
#   evaluator-quorum   independent N-of-M evaluators (hold the private keys); sign
#                      votes only for executable decisions. VoltAgent never holds a key.
#   agent-credentials-init  one-shot trusted provisioner: one credential per
#                      agent into that agent's own volume + a hash-only registry.
#   voltagent-agent    the real VoltAgent agent as agent/notify-bot (its own
#                      credential only). Talks to the gateway + quorum only;
#                      no notification-service client, no operator key, no bypass.
#   voltagent-agent-unknown  the same agent code as agent/unknown, in its OWN
#                      container with its OWN credential (ESCALATE).
#   voltagent-operator approve-only operator sidecar (operator key only).
#
# Trust boundary: the agent shares a network with the gateway + quorum only. The
# mock notification service is reachable by the governed executor, never the agent.
networks:
  agent_edge:
  gov_internal:

volumes:
  mcc-config:
  voltagent-audit:
  voltagent-state:
  agent-cred-notify-bot:
  agent-cred-unknown:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-notification:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.mcc
    command: ["uvicorn", "pilot_notify.service:app", "--host", "0.0.0.0", "--port", "9200"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9200/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-credentials-init:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.mcc
    # V05 (part 2) -- TRUSTED PROVISIONING BOUNDARY (one-shot, no network).
    # A fresh random credential per agent into THAT agent's own volume; the
    # registry (SHA-256 hashes only) into mcc-config. The only container that
    # ever sees more than one raw agent key. No agent key is committed.
    user: "0:0"
    network_mode: none
    command:
      - "python"
      - "-m"
      - "gateway.agent_provisioning"
      - "--registry"
      - "/config/agent_credentials.json"
      - "--tenant-id"
      - "pilot"
      - "--owner"
      - "1000:1000"
      - "--agent"
      - "agent/notify-bot=/creds/notify-bot"
      - "--agent"
      - "agent/unknown=/creds/unknown"
    volumes:
      - mcc-config:/config
      - agent-cred-notify-bot:/creds/notify-bot
      - agent-cred-unknown:/creds/unknown

  mcc-gateway:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.mcc
    # Generate the evaluator keyset into the shared volume on first start (idempotent),
    # then serve. Done here rather than in a one-shot container so nothing exits
    # early (which would trip --abort-on-container-exit and tear down the stack).
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /config/consensus_trust.json ]; then
          python -m integrations.voltagent.mcc_side.generate_config --out /config --evaluators 3
        fi
        exec uvicorn gateway.app:app --host 0.0.0.0 --port 8001
    environment:
      MCC_GATEWAY_API_KEY: "demo-key"
      MCC_GATEWAY_OPERATOR_API_KEY: "op-key"
      # Independent authority-side policy (PROPOSAL != PERMISSION): an
      # authenticated operator key alone no longer suffices to grant an
      # ESCALATE approval -- this exact, independently configured policy
      # must also ALLOW the operation. Set only here (mcc-gateway); the
      # voltagent-agent never reads or supplies this file.
      MCC_AUTHORITY_POLICY_CONFIG: "/app/authority_policy.notify.json"
      # V05 (part 2): per-agent credential registry -- SHA-256 hashes only,
      # written by agent-credentials-init. The gateway never sees a raw agent key.
      MCC_AGENT_CREDENTIALS_CONFIG: "/config/agent_credentials.json"
      MCC_GATEWAY_MODE: "inline"
      MCC_GATEWAY_AUDIT_LOG_PATH: "/data/audit.jsonl"
      # Receipt-verifying governed executor: EXECUTED only on a confirmed receipt.
      MCC_UPSTREAM_BASE: "http://mock-notification:9200"
      MCC_UPSTREAM_RECEIPT_VERIFY: "1"
      # Multi-Context Consensus: trust the evaluator quorum's public keys.
      MCC_CONSENSUS_TRUST_CONFIG: "/config/consensus_trust.json"
      MCC_CONSENSUS_THRESHOLD: "3"
      # Redis-backed state (fail closed if Redis is down).
      MCC_REDIS_URL: "redis://redis:6379/0"
      MCC_NONCE_BACKEND: "redis"
      MCC_IDEMPOTENCY_BACKEND: "redis"
      MCC_VELOCITY_BACKEND: "redis"
      MCC_APPROVAL_BACKEND: "redis"
      MCC_CHALLENGE_BACKEND: "redis"
      # Clock-skew hardening (PR #122): resolve `now` for approval/mandate/
      # gate validity checks from this SAME shared, validated Redis clock
      # rather than each gateway instance's own local clock.
      MCC_TIME_TRUST_BACKEND: "redis"
    volumes:
      - mcc-config:/config
      - voltagent-audit:/data
    networks: [agent_edge, gov_internal]
    depends_on:
      agent-credentials-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  evaluator-quorum:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.mcc
    # Wait for the gateway to have written the evaluator keyset, then serve.
    command:
      - /bin/sh
      - -c
      - |
        until [ -f /config/evaluator_1.pem ]; do echo "waiting for evaluator keys..."; sleep 1; done
        exec uvicorn integrations.voltagent.mcc_side.evaluator_quorum:app --host 0.0.0.0 --port 8080
    environment:
      MCC_QUORUM_GATEWAY_URL: "http://mcc-gateway:8001"
      MCC_GATEWAY_API_KEY: "demo-key"
      MCC_EVALUATOR_KEYS_DIR: "/config"
      # V05 (part 2): also accept the agents' own registered credentials
      # (the hash-only registry agent-credentials-init wrote).
      MCC_AGENT_CREDENTIALS_CONFIG: "/config/agent_credentials.json"
    volumes:
      - mcc-config:/config:ro
    networks: [agent_edge, gov_internal]
    depends_on:
      mcc-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  voltagent-agent:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.agent
    # V05 (part 2): this container IS ONE agent principal (agent/notify-bot:
    # ALLOW/DENY/CONSTRAIN). It holds ONLY its own provisioned credential --
    # no operator key, no shared tenant key, no other agent's credential.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8001"
      MCC_QUORUM_URL: "http://evaluator-quorum:8080"
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_PILOT_STATE_DIR: "/pilot-state"
      MCC_VOLTAGENT_RESOURCE: "crm"
      # Deterministic offline model by default (no paid API). Set
      # MCC_VOLTAGENT_MODEL_PROVIDER=openai + OPENAI_API_KEY to use a real LLM.
      MCC_VOLTAGENT_MODEL_PROVIDER: "deterministic"
    volumes:
      - voltagent-state:/pilot-state
      - agent-cred-notify-bot:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy
      evaluator-quorum:
        condition: service_healthy

  voltagent-agent-unknown:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.agent
    # V05 (part 2): this container IS ONE agent principal (agent/unknown:
    # ESCALATE; it executes its OWN approved operation). It holds ONLY its own provisioned credential --
    # no operator key, no shared tenant key, no other agent's credential.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8001"
      MCC_QUORUM_URL: "http://evaluator-quorum:8080"
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_PILOT_STATE_DIR: "/pilot-state"
      MCC_VOLTAGENT_RESOURCE: "crm"
      # Deterministic offline model by default (no paid API). Set
      # MCC_VOLTAGENT_MODEL_PROVIDER=openai + OPENAI_API_KEY to use a real LLM.
      MCC_VOLTAGENT_MODEL_PROVIDER: "deterministic"
    volumes:
      - voltagent-state:/pilot-state
      - agent-cred-unknown:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy
      evaluator-quorum:
        condition: service_healthy

  # Approve-ONLY operator sidecar (operator key only). It never executes and
  # holds no agent credential: it approves each pending escalation recorded in
  # the shared state volume and hands the single-use mandate back; the
  # escalating agent then executes with its own credential. The gateway's
  # independent authority policy still decides whether approval is allowed.
  voltagent-operator:
    build:
      context: .
      dockerfile: integrations/voltagent/docker/Dockerfile.mcc
    command: ["python", "-m", "integrations.voltagent.mcc_side.operator_cli", "--watch"]
    environment:
      MCC_OPERATOR_GATEWAY_URL: "http://mcc-gateway:8001"
      MCC_GATEWAY_OPERATOR_API_KEY: "op-key"
      MCC_PILOT_STATE_DIR: "/pilot-state"
      PYTHONUNBUFFERED: "1"
    volumes:
      - voltagent-state:/pilot-state
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy
