  certification-five-ecosystems-aggregate:
    # All-or-nothing: this job requires all five certification-<ecosystem>
    # jobs above to have succeeded (GitHub Actions' default `needs:` behavior
    # skips this job -- and therefore fails the required check -- if any one
    # of them failed; there is no continue-on-error anywhere in this block).
    needs:
      - certification-generic-http
      - certification-langgraph
      - certification-crewai
      - certification-autogen
      - certification-voltagent
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:.:sdk/python/src"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Regenerate the SAME disposable CI candidate Issuer/Trust Store
        run: python scripts/generate_ci_candidate_issuer.py --output-dir /tmp/mcc-ci-trust

      - uses: actions/download-artifact@v4
        with:
          pattern: certification-candidate-*
          path: /tmp/candidate-runs
          merge-multiple: false

      - name: Build the all-or-nothing aggregate five-ecosystem Publication Set
        run: |
          python -m mcc_certify aggregate-publish \
            --trust-store /tmp/mcc-ci-trust/trust-store.json \
            --publication-dir artifacts/aggregate-candidate \
            --run generic-http=/tmp/candidate-runs/certification-candidate-generic-http/generic-http/ci-candidate-run \
            --run langgraph=/tmp/candidate-runs/certification-candidate-langgraph/langgraph/ci-candidate-run \
            --run crewai=/tmp/candidate-runs/certification-candidate-crewai/crewai/ci-candidate-run \
            --run autogen=/tmp/candidate-runs/certification-candidate-autogen/autogen/ci-candidate-run \
            --run voltagent=/tmp/candidate-runs/certification-candidate-voltagent/voltagent/ci-candidate-run \
            --format json | tee /tmp/aggregate-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/aggregate-result.json"))["record_count"])')" = "5"

      - name: Independently re-verify the aggregate Publication Set
        run: |
          python -m mcc_certify verify-aggregate \
            --trust-store /tmp/mcc-ci-trust/trust-store.json \
            --publication-dir artifacts/aggregate-candidate \
            --run generic-http=/tmp/candidate-runs/certification-candidate-generic-http/generic-http/ci-candidate-run \
            --run langgraph=/tmp/candidate-runs/certification-candidate-langgraph/langgraph/ci-candidate-run \
            --run crewai=/tmp/candidate-runs/certification-candidate-crewai/crewai/ci-candidate-run \
            --run autogen=/tmp/candidate-runs/certification-candidate-autogen/autogen/ci-candidate-run \
            --run voltagent=/tmp/candidate-runs/certification-candidate-voltagent/voltagent/ci-candidate-run \
            --format json | tee /tmp/verify-aggregate-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/verify-aggregate-result.json"))["valid"])')" = "True"

      - name: Scan aggregate artifacts for private-key material
        run: |
          if grep -R "PRIVATE KEY" artifacts/aggregate-candidate/ ; then
            echo "STOP: private key material found in the aggregate publication set"; exit 1
          fi

      - name: Upload NON-OFFICIAL aggregate five-ecosystem Publication Set
