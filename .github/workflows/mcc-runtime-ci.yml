name: MCC Runtime CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository and runs tests/smoke
# checks — it never writes to the repo, comments, or publishes artifacts. The
# read-only default is set at the top level and inherited by every job.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # tests/test_agent_operator_credential_separation.py's non-vacuity
          # checks run `git show <historical-finding-commit>:<path>` against
          # a specific ancestor commit to prove the check actually detects
          # the original vulnerability. A shallow (default depth=1) clone
          # does not fetch that commit object, so `git show` fails with
          # "fatal: ... not a valid object name" (exit 128) even though the
          # commit IS an ancestor of HEAD. Full history is required.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Redis (tests/test_assurance_scaffolding.py drives Workstream E's real cross-instance replay resistance)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server redis-tools

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  normative-v1-conformance:
    # MCC Normative v1.0 — Implementation Conformance Baseline. Recomputes the
    # requirement inventory directly from specs/MCC-{CP,EB,CM,TC}-001.md (never
    # trusts the committed artifacts), validates structure/schema/baseline
    # provenance, confirms the committed conformance/normative-v1.0/ artifacts
    # are byte-identical to a fresh generation (so a stale, uncommitted
    # regeneration fails CI), and runs the dedicated test suite. This baseline
    # is observational: it does not certify MCC-Core or any adapter — see
    # conformance/normative-v1.0/README.md.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate the Normative v1.0 conformance baseline (fail-closed)
        run: python -m mcc_conformance validate

      - name: Conformance baseline tests
        run: |
          pytest tests/test_conformance_baseline.py -v
          pytest tests/test_conformance_extraction_correction.py -v

      - name: Confirm committed artifacts are not stale (regenerate + diff)
        run: |
          python -m mcc_conformance generate
          git diff --exit-code -- conformance/normative-v1.0/ || {
            echo "STOP: conformance/normative-v1.0/ artifacts are stale."
            echo "Run: python -m mcc_conformance generate, then commit the result."
            exit 1
          }
          echo "OK: conformance artifacts are deterministic and up to date."

      - name: Upload conformance baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normative-v1-conformance-baseline
          path: conformance/normative-v1.0/
          if-no-files-found: error

  certification-pipeline:
    # MCC End-to-End Certification Pipeline (PR #67): mcc_certify orchestrates
    # the complete MCC-CP-001 chain (Conformance Run -> Evidence Bundle ->
    # Certification Manifest -> Technical Certificate -> Offline Verification)
    # over the existing Wave A/B/C mcc_evidence producers/verifiers, unchanged.
    # This job installs the full dev dependency set (mcc_certify depends on
    # mcc_evidence/mcc_core/mcc_conformance, none of which ship in the curated
    # mcc-core PyPI wheel -- see docs/CERTIFICATION_PIPELINE.md, "CLI", for why),
    # runs the deterministic reference-fixture certification twice to prove
    # reproducibility, independently re-verifies the resulting run offline, runs
    # the full tamper-negative suite, and uploads the generated run as a CI
    # artifact. No allow-failure; a stage failure, a verification failure, or
    # nondeterminism between the two runs fails this job.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Package/import smoke test
        run: |
          python -c "import mcc_certify; print(mcc_certify.CertificationPipeline, mcc_certify.resolve_target)"
          python -m mcc_certify list-targets

      - name: Certification pipeline unit + architecture-guard tests
        run: |
          pytest tests/test_mcc_certify_pipeline.py -v
          pytest tests/test_mcc_certify_architecture_guards.py -v

      - name: Deterministic reference certification (run 1 of 2)
        run: |
          python -m mcc_certify certify reference-fixture \
            --output artifacts/certification-ci/run1 \
            --run-id ci-reference-run \
            --timestamp 2026-07-26T00:00:00Z \
            --format json | tee /tmp/ci-run1-result.json
          test "$(python -c 'import json,sys; print(json.load(open("/tmp/ci-run1-result.json"))["outcome"])')" = "CERTIFIED"

      - name: Deterministic reference certification (run 2 of 2, independent output dir)
        run: |
          python -m mcc_certify certify reference-fixture \
            --output artifacts/certification-ci/run2 \
            --run-id ci-reference-run \
            --timestamp 2026-07-26T00:00:00Z \
            --format json | tee /tmp/ci-run2-result.json
          test "$(python -c 'import json,sys; print(json.load(open("/tmp/ci-run2-result.json"))["outcome"])')" = "CERTIFIED"

      - name: Confirm deterministic regeneration (byte-identical artifacts across both runs)
        run: |
          diff -rq \
            artifacts/certification-ci/run1/reference-fixture/ci-reference-run \
            artifacts/certification-ci/run2/reference-fixture/ci-reference-run \
          && echo "OK: both runs produced byte-identical artifacts" || {
            echo "STOP: nondeterministic certification run output"; exit 1;
          }

      - name: Independent offline verification of the resulting run
        run: |
          python -m mcc_certify verify \
            artifacts/certification-ci/run1/reference-fixture/ci-reference-run --format json \
          | tee /tmp/ci-verify-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/ci-verify-result.json"))["valid"])')" = "True"

      - name: Upload the test certification run as a CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-certify-reference-run
          path: artifacts/certification-ci/
          if-no-files-found: error

  certification-trust-publication:
    # MCC Certification Trust Anchor, Issuer Key Management & Publication
    # Foundation (PR #68): the Issuer Identity model, offline Trust Store,
    # Signing-Key Provider contract, static Publication mechanism, and
    # trusted offline verification against an explicit trust-anchor set —
    # all built above the unchanged PR #67 mcc_certify pipeline. This job
    # generates a throwaway Ed25519 issuer key AT RUNTIME (never committed
    # to the repository, never a production key), builds an Issuer Identity
    # + Trust Store from it, certifies the reference fixture through the
    # packaged CLI in OFFICIAL mode, independently re-verifies the result
    # against the explicit trust store + publication index, greps every
    # generated artifact for private-key material (fails the job if any is
    # found), confirms mcc_certify remains excluded from the curated
    # mcc-core wheel (no packaging regression), and uploads only the
    # non-secret run/publication artifacts — never the private key file.
    # No allow-failure.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (+ build for the packaging regression check)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install build

      - name: Package/import smoke test (PR #68 public API)
        run: |
          python -c "from mcc_certify import (IssuerIdentity, TrustStore, LocalFileSigningKeyProvider, \
            FixtureSigningKeyProvider, PublicationRecord, PublicationIndex, \
            verify_certification_run_trusted, build_issuer_identity, build_trust_store); \
            print('PR #68 public API OK')"

      - name: Trust/Issuer/Publication unit tests + architecture guards
        run: |
          pytest tests/test_mcc_certify_pr68.py -v
          pytest tests/test_mcc_certify_trust_publication_guards.py -v
          pytest tests/test_mcc_certify_architecture_guards.py -v
          pytest tests/test_mcc_certify_pipeline.py -v

      - name: Packaging regression — mcc_certify still excluded from the curated wheel
        run: |
          python -m build --wheel --sdist --outdir /tmp/mcc-certify-ci-dist .
          python - <<'PYEOF'
          import zipfile, glob, sys
          wheel = sorted(glob.glob("/tmp/mcc-certify-ci-dist/*.whl"))[-1]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          leaked = [n for n in names if n.startswith("mcc_certify/") or n.startswith("mcc_evidence/") or n.startswith("mcc_conformance/")]
          if leaked:
              print("STOP: curated wheel unexpectedly ships governance-adjacent packages:", leaked)
              sys.exit(1)
          print("OK: curated wheel does not ship mcc_certify/mcc_evidence/mcc_conformance")
          PYEOF

      - name: Generate a throwaway (non-production) Issuer signing key
        run: |
          mkdir -p /tmp/mcc-certify-ci-trust
          python - <<'PYEOF'
          from cryptography.hazmat.primitives import serialization
          from mcc_core.signing import SigningKey
          from mcc_certify.issuer import build_issuer_identity, write_issuer_identity
          from mcc_certify.trust_store import build_trust_store, write_trust_store

          key = SigningKey.generate("ci-issuer-key-1")
          with open("/tmp/mcc-certify-ci-trust/issuer-key.pem", "wb") as f:
              f.write(key._private_key.private_bytes(
                  serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption(),
              ))
          issuer = build_issuer_identity(
              issuer_id="mcc-ci-issuer", display_name="MCC Runtime CI Throwaway Issuer",
              key_id="ci-issuer-key-1", public_key=key.public_key(),
              valid_from=1785024000, created_at=1785024000,
          )
          write_issuer_identity(issuer, "/tmp/mcc-certify-ci-trust/issuer.json")
          write_trust_store(build_trust_store((issuer,)), "/tmp/mcc-certify-ci-trust/trust-store.json")
          print("CI throwaway issuer + trust store generated (never committed)")
          PYEOF

      - name: Official-mode certification through the CLI
        run: |
          python -m mcc_certify certify reference-fixture \
            --output artifacts/certification-trust-ci/run \
            --run-id ci-official-run \
            --timestamp 2026-07-26T00:00:00Z \
            --issuer-config /tmp/mcc-certify-ci-trust/issuer.json \
            --signing-key /tmp/mcc-certify-ci-trust/issuer-key.pem \
            --trust-store /tmp/mcc-certify-ci-trust/trust-store.json \
            --publication-dir artifacts/certification-trust-ci/publication \
            --format json | tee /tmp/ci-official-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/ci-official-result.json"))["outcome"])')" = "CERTIFIED"

      - name: Trusted offline re-verification against the explicit trust store
        run: |
          python -m mcc_certify verify \
            artifacts/certification-trust-ci/run/reference-fixture/ci-official-run \
            --trust-store /tmp/mcc-certify-ci-trust/trust-store.json \
            --publication-index artifacts/certification-trust-ci/publication/publication-index.json \
            --require-published --format json | tee /tmp/ci-official-verify.json
          test "$(python -c 'import json; print(json.load(open("/tmp/ci-official-verify.json"))["valid"])')" = "True"

      - name: Tamper-negative check — wrong trust store must fail verification
        run: |
          python - <<'PYEOF'
          import sys
          from cryptography.hazmat.primitives import serialization
          from mcc_core.signing import SigningKey
          from mcc_certify.issuer import build_issuer_identity, write_issuer_identity
          from mcc_certify.trust_store import build_trust_store, write_trust_store
          from mcc_certify.verify import verify_certification_run_trusted

          wrong_key = SigningKey.generate("ci-issuer-key-1")
          wrong_issuer = build_issuer_identity(
              issuer_id="mcc-ci-issuer", display_name="Wrong Issuer", key_id="ci-issuer-key-1",
              public_key=wrong_key.public_key(), valid_from=1785024000, created_at=1785024000,
          )
          wrong_store = build_trust_store((wrong_issuer,))
          report = verify_certification_run_trusted(
              "artifacts/certification-trust-ci/run/reference-fixture/ci-official-run",
              trust_store=wrong_store,
          )
          if report["valid"]:
              print("STOP: verification succeeded against a wrong trust store")
              sys.exit(1)
          print("OK: wrong trust store correctly fails verification")
          PYEOF

      - name: Verify no secrets in generated artifacts
        run: |
          if grep -R "PRIVATE KEY" artifacts/certification-trust-ci/ ; then
            echo "STOP: private key material found in generated certification artifacts"
            exit 1
          fi
          echo "OK: no private key material in artifacts/certification-trust-ci/"

      - name: Upload non-secret certification + publication evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-certify-trust-publication-evidence
          path: artifacts/certification-trust-ci/
          if-no-files-found: error

  protocol:
    # Canonical Governance Protocol & Canonical Ingress Pipeline (PR #49).
    # Offline unit tests + architecture/reconciliation guards prove one normative
    # wire contract (reconciled with PR #43), CanonicalProposal/GovernanceDecision,
    # the mandatory in-process ingress pipeline, version negotiation (fail-closed),
    # and that adapters cannot bypass the pipeline/gateway/audit or authorize
    # locally. Then generates the reproducible ingress evidence (every registered
    # adapter -> CanonicalProposal -> pipeline -> real gateway -> GovernanceDecision).
    runs-on: ubuntu-latest
    env:
      MCC_USE_OPA: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Protocol unit tests + architecture/reconciliation guards
        run: pytest tests/protocol/ -v

      - name: Canonical Ingress evidence (proposal -> pipeline -> real gateway)
        run: pytest tests/interoperability/test_canonical_ingress.py -v

      - name: Upload canonical ingress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ingress-evidence
          path: artifacts/protocol/
          if-no-files-found: warn

  adapter-sdk:
    # Adapter SDK (PR #50) — the public, framework-neutral SDK third parties use to
    # build MCC-Core adapters. Runs the SDK unit tests + architecture guards + the
    # import-boundary regression (importing the SDK/protocol never loads the
    # governance engine), the minimal example, deterministic evidence generation,
    # the migrated reference adapter's interoperability, and the packaged clean
    # install of the curated (engine-free) wheel. Offline; no external services.
    runs-on: ubuntu-latest
    env:
      MCC_USE_OPA: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (+ build for the packaging checks)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install build

      - name: Adapter SDK tests + architecture guards + reference-migration interop
        run: pytest tests/adapter_sdk/ -v

      - name: Import-boundary regression (SDK/protocol import loads no engine)
        run: pytest tests/adapter_sdk/test_import_boundary.py -v

      - name: Minimal example (no execution, no credentials, no side effects)
        run: python examples/adapter_sdk/minimal_adapter.py
        env:
          PYTHONPATH: "src:sdk/python/src:."

      - name: Deterministic evidence generation (generate twice, compare)
        run: |
          python -c "import examples.adapter_sdk.minimal_adapter as m; \
            from mcc_adapter_sdk import generate_adapter_evidence; \
            a=m.GreetingAdapter(); \
            e1=generate_adapter_evidence(a, write=False); \
            e2=generate_adapter_evidence(a, write=False); \
            assert e1==e2, 'evidence not deterministic'; print('evidence deterministic OK')"
        env:
          PYTHONPATH: "src:sdk/python/src:."

      - name: Public API import smoke
        run: |
          python -c "from mcc_adapter_sdk import (Adapter, AdapterMetadata, AdapterContext, \
            AdapterRunner, AdapterRunResult, AdapterRegistration, AdapterValidationReport, \
            register_adapter, validate_adapter, generate_adapter_evidence, SDK_VERSION); \
            print('curated public API OK', SDK_VERSION)"
        env:
          PYTHONPATH: "src:sdk/python/src:."

      - name: Packaging — build wheel/sdist, inspect content, clean install, run example
        run: pytest tests/test_artifact_contract.py -v

      - name: Upload Adapter SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-sdk-evidence
          path: artifacts/adapter-sdk/
          if-no-files-found: warn

  compliance:
    # Integration Contract Compliance & Certification Suite (PR #44).
    # Runs the suite's unit + integration tests, then certifies the reference and
    # VoltAgent adapters through the SAME framework-neutral boundary and asserts a
    # deliberately non-compliant adapter is rejected. Reports are uploaded as
    # artifacts. Offline and deterministic; no external services, no secrets.
    runs-on: ubuntu-latest
    env:
      # The CLI steps run without conftest, so set the source path and keep the
      # gateway/audit off the prior-art chain explicitly.
      PYTHONPATH: "src:sdk/python/src:."
      MCC_USE_OPA: "false"
      MCC_AUDIT_LOG_PATH: "/tmp/mcc-compliance/audit.jsonl"
      MCC_GATEWAY_AUDIT_LOG_PATH: "/tmp/mcc-compliance/gw-audit.jsonl"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Prepare isolated audit directory
        run: mkdir -p /tmp/mcc-compliance

      - name: Compliance suite unit + integration tests
        run: pytest tests/test_compliance_suite.py -v

      - name: Certified Adapter Program tests
        run: pytest tests/test_certified_adapter_program.py -v

      - name: Governance Capability Profile tests
        run: pytest tests/test_capability_profile.py -v

      - name: Validate the reference capability profiles (schema + semantics)
        run: |
          for f in minimal-valid full-capable unsupported-optional voltagent-reference-example; do
            python -m mcc_compliance validate-capabilities "tests/capability_profiles/$f.json"
          done
          # A deliberately invalid profile must be rejected (non-zero).
          if python -m mcc_compliance validate-capabilities \
               tests/capability_profiles/invalid-overlap.json; then
            echo "::error::an invalid capability profile was accepted"; exit 1
          fi
          echo "OK: valid profiles accepted, invalid profile rejected"

      - name: Certify the reference adapter (must be CERTIFIED)
        run: |
          python -m mcc_compliance certify --adapter reference \
            --contract-version 1.0 --output-dir artifacts/compliance
          # Exit 0 == CERTIFIED (the step fails otherwise).

      - name: Certify VoltAgent through the generic boundary (must be CERTIFIED)
        run: |
          python -m mcc_compliance certify --adapter voltagent \
            --contract-version 1.0 --output-dir artifacts/compliance

      - name: Verify the committed certification manifest is not stale or tampered
        run: |
          # Regenerates certification from real evidence and compares it to the
          # committed certifications/manifest.json. Fails (non-zero) if any official
          # adapter no longer conforms, or a digest/status/count was hand-edited.
          python -m mcc_compliance verify-manifest

      - name: A deliberately non-compliant adapter must FAIL certification
        run: |
          # Registers an always-allow double and asserts the CLI rejects it
          # (non-zero exit). If it were incorrectly certified, this step fails.
          python - <<'PY'
          import sys
          from mcc_compliance.models import AdapterMetadata, AdapterOutcome
          from mcc_compliance.registry import register_adapter
          from mcc_compliance.cli import main
          from mcc_client.contract import CONTRACT_VERSION

          class AlwaysAllow:
              def describe(self):
                  return AdapterMetadata("ci-always-allow", "0.0.1", "ci/always-allow",
                                         CONTRACT_VERSION, None)
              def run_scenario(self, ctx):
                  return AdapterOutcome(verdict="ALLOW", executed=True, audit_valid=True)

          register_adapter("ci-always-allow", AlwaysAllow)
          rc = main(["certify", "--adapter", "ci-always-allow", "--contract-version", "1.0"])
          assert rc != 0, "FAIL: a non-compliant adapter was incorrectly certified"
          print(f"OK: non-compliant adapter rejected (exit {rc})")
          PY

      - name: Adapter-SDK certification tests (PR #51 — SDK is the canonical ingress)
        run: pytest tests/test_sdk_certification.py -v

      - name: Certify the reference adapter THROUGH the Adapter SDK (must be CERTIFIED)
        run: |
          python -m mcc_compliance certify-sdk --contract-version 1.0 \
            --output-dir artifacts/certification
          # Exit 0 == CERTIFIED (the step fails otherwise).

      - name: Certification outputs are reproducible (generate twice, compare)
        run: |
          python -m mcc_compliance certify-sdk --contract-version 1.0 \
            --output-dir artifacts/certification-rerun
          for f in certification.json evidence.json certification-report.md; do
            if ! diff -q "artifacts/certification/$f" "artifacts/certification-rerun/$f"; then
              echo "::error::certification output $f is not reproducible"; exit 1
            fi
          done
          echo "OK: certification.json / evidence.json / certification-report.md reproducible"

      - name: Upload compliance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports-ic-1.0-suite-1.0.0
          path: artifacts/compliance/
          if-no-files-found: warn

      - name: Upload SDK certification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-sdk-certification
          path: artifacts/certification/
          if-no-files-found: warn

  interoperability:
    # Multi-Adapter Interoperability Proof — 48a foundation.
    # Boots ONE real out-of-process MCC Gateway and drives the framework-neutral
    # HTTP adapter (5/5) through the seven common governance scenarios over a real
    # HTTP boundary, with static bypass guards and a deterministic evidence bundle.
    # The four real-framework adapters (VoltAgent/LangGraph/CrewAI/AutoGen) are
    # added in 48b–e with their own isolated dependency installs. Offline, no LLM.
    runs-on: ubuntu-latest
    env:
      MCC_USE_OPA: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Interoperability proof (shared out-of-process Gateway, real HTTP)
        run: pytest tests/interoperability/ -v

      - name: Upload interoperability evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interoperability-evidence-48a
          path: artifacts/interoperability/
          if-no-files-found: warn

  interop-langgraph:
    # 48b — real LangGraph adapter (2/5) through the SAME shared Gateway. Installs
    # the official langgraph distribution as an isolated optional dependency and
    # asserts it is genuinely present and exercised (a native CompiledStateGraph is
    # built and invoked). A missing/absent framework fails the job — it is never
    # silently skipped here. Offline, no LLM, no external API keys.
    runs-on: ubuntu-latest
    env:
      MCC_USE_OPA: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (+ isolated langgraph)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r tests/interoperability/requirements-langgraph.txt

      - name: Show resolved framework version
        run: python -c "import importlib.metadata as m; print('langgraph', m.version('langgraph'))"

      - name: Assert the official LangGraph package is really importable
        run: python -c "import langgraph; from langgraph.graph import StateGraph; from langgraph.graph.state import CompiledStateGraph; print('langgraph native API present')"

      - name: Interoperability proof WITH the real LangGraph adapter
        # test_framework_provenance is NOT skipped here (langgraph installed): it
        # fails if the adapter is missing or not a genuine native integration.
        run: pytest tests/interoperability/ -v

      - name: Upload interoperability evidence bundle (with LangGraph)
        if: always()
