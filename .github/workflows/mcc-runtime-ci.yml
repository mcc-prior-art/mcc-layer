  # ---------------------------------------------------------------------------
  # PR #69 — Official Certification of the Five Reference Ecosystems.
  #
  # Each certification-<ecosystem> job below certifies exactly ONE production
  # reference ecosystem through the identical `mcc certify <target>` pipeline
  # (PR #67/#68), reusing that ecosystem's REAL, unmodified PR #48 adapter --
  # never a mock, stub, or metadata-only descriptor. Every job:
  #   1. installs that ecosystem's real, isolated framework dependency (the
  #      SAME isolation as interop-langgraph/-autogen/-crewai/-voltagent above
  #      -- these frameworks are never installed together in one job/process);
  #   2. asserts the real native package/API is genuinely importable;
  #   3. generates a DISPOSABLE, clearly-labelled non-production CI candidate
  #      Issuer signing key at runtime (deterministic across jobs so the
  #      aggregate job's shared Trust Store recognizes all five signatures --
  #      this is a disclosed test convenience, never claimed official);
  #   4. certifies the target in official mode against that CI candidate
  #      Issuer/Trust Store (exercising the full official-mode code path)
  #      and independently re-verifies the result;
  #   5. scans every generated artifact for private-key material;
  #   6. uploads only the resulting NON-OFFICIAL candidate certification
  #      artifacts (never the private key).
  # No job in this block ever claims OFFICIAL certification -- that requires
  # the real, separately-protected Issuer key (see
  # .github/workflows/mcc-official-certification.yml and
  # docs/CERTIFICATION_FIVE_ECOSYSTEMS.md, "Candidate versus official status").
  # ---------------------------------------------------------------------------

  certification-generic-http:
    # generic-http has no optional framework dependency -- always runnable.
    runs-on: ubuntu-latest
    env:
      MCC_USE_OPA: "false"
      PYTHONPATH: "src:.:sdk/python/src"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate the disposable, non-production CI candidate Issuer
        run: python scripts/generate_ci_candidate_issuer.py --output-dir /tmp/mcc-ci-trust

      - name: Certify generic-http (candidate, official-mode code path, disposable issuer)
        run: |
          python -m mcc_certify certify generic-http \
            --output artifacts/certification-candidate \
            --run-id ci-candidate-run --timestamp 2026-07-26T00:00:00Z \
            --issuer-config /tmp/mcc-ci-trust/issuer.json \
            --signing-key /tmp/mcc-ci-trust/issuer-key.pem \
            --trust-store /tmp/mcc-ci-trust/trust-store.json \
            --publication-dir artifacts/certification-candidate/publication \
            --format json | tee /tmp/certify-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/certify-result.json"))["outcome"])')" = "CERTIFIED"

      - name: Independently re-verify the candidate certification
        run: |
          python -m mcc_certify verify \
            artifacts/certification-candidate/generic-http/ci-candidate-run \
            --trust-store /tmp/mcc-ci-trust/trust-store.json --format json | tee /tmp/verify-result.json
          test "$(python -c 'import json; print(json.load(open("/tmp/verify-result.json"))["valid"])')" = "True"

      - name: Scan candidate artifacts for private-key material
        run: |
          if grep -R "PRIVATE KEY" artifacts/certification-candidate/ ; then
            echo "STOP: private key material found in candidate certification artifacts"; exit 1
          fi
          echo "OK: no private key material in candidate artifacts"

      - name: Upload NON-OFFICIAL candidate certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-candidate-generic-http
          path: artifacts/certification-candidate/
          if-no-files-found: error

