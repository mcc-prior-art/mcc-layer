name: Agent Credential Isolation (containers, mandatory)

# V05 (part 2) -- per-agent credential isolation in REAL containers, against the
# actual deployable stack (docker-compose.pilot-voltagent.yml) and the real
# gateway's HTTP authentication: two agent principals (A, B) in separate
# containers of the same tenant. Verifies that B's environment, files, mounts
# and image expose no other agent's credential, provisioning map, shared tenant
# key, operator key or build-context secret, and that B -- with its own
# credential and A's copied mandate -- cannot act as A on any identity route,
# with positive controls (A and B each execute their own operations; single-use
# holds). See tests/container/test_agent_credential_isolation.py.
#
# MANDATORY: no continue-on-error; MCC_REQUIRE_CONTAINER_TESTS=1 makes a
# missing Docker daemon a failure, and any skipped test fails the job.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-credential-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Show Docker + Compose versions
        run: |
          docker version
          docker compose version

      - name: Container credential-isolation tests (real images, real gateway auth)
        env:
          MCC_RUN_CONTAINER_TESTS: "1"
          MCC_REQUIRE_CONTAINER_TESTS: "1"
        run: |
          set -o pipefail
          python -m pytest tests/container/test_agent_credential_isolation.py -v -rA \
            -p no:cacheprovider 2>&1 | tee isolation.log
          if grep -Eq "SKIPPED|[0-9]+ skipped" isolation.log; then
            echo "::error::container isolation tests were SKIPPED -- they are mandatory"
            exit 1
          fi
          grep -Eq "[0-9]+ passed" isolation.log \
            || { echo "::error::no container isolation test passed"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: docker ps -a || true
