# Framework-Neutral Reference Governed Agent — one-command E2E.
#
#   scripts/compose_agents_e2e.sh docker-compose.reference-agent.yml \
#       "mcc-gateway reference-agent-operator" "reference-agent-escalate reference-agent"
#
# Services:
#   redis              — Redis-backed nonce/idempotency/velocity/approval state.
#   mock-notification  — the local mock external service the agent notifies.
#   mcc-gateway        — the MCC gateway: authority + decision token + execution
#                        gate + coordinator + audit. The GOVERNED EXECUTOR is the
#                        gateway's coordinator-driven execution path plus the
#                        receipt-verifying adapter (MCC_UPSTREAM_RECEIPT_VERIFY=1):
#                        it performs the outbound call and confirms the receipt, so
#                        EXECUTED means a genuine, matching external receipt.
#   reference-agent    — the framework-neutral reference agent: uses the SDK only;
#                        never calls the mock service directly. There is no second
#                        or bypass execution path. Runs as agent/notify-bot
#                        holding ONLY its own provisioned credential (V05 part
#                        2) -- no operator key, no shared tenant key.
#   reference-agent-escalate — the same runner as agent/unknown (ESCALATE), in
#                        its OWN container with its OWN credential.
#   agent-credentials-init — one-shot TRUSTED provisioner (no network): one
#                        credential per agent into its own volume + a
#                        SHA-256-only registry for the gateway.
#   reference-agent-operator — SEPARATE process/container/credential holder from
#                        reference-agent. Holds the operator key. Watches a
#                        shared, non-secret state file (the pending approval's
#                        request_id + the agent's original proposal) and
#                        grants + executes it under the ORIGINAL
#                        correlation_id. See gateway_approval_operator.py
#                        (shared with docker-compose.notify-pilot.yml).
#
# Authority principal separation: AGENT_CREDENTIALS ∩ AUTHORITY_CREDENTIALS = ∅.
# reference-agent cannot self-approve its own ESCALATE (it has no operator
# key, even if its own code were compromised); the approval is always
# granted by a separate process, for the exact action reference-agent
# proposed. (The DENY scenario never involves an operator at all.)
#
# Trust boundary: the agent shares a network with the gateway only. The mock
# service is reachable by the gateway (governed executor) but NOT by the agent.
networks:
  agent_edge:
  gov_internal:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-notification:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    command: ["uvicorn", "pilot_notify.service:app", "--host", "0.0.0.0", "--port", "9200"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9200/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-credentials-init:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    # V05 (part 2) -- TRUSTED PROVISIONING BOUNDARY (one-shot, no network).
    # Generates a fresh random credential per agent into THAT agent's own
    # volume and the gateway's registry (SHA-256 hashes only) into
    # agent-registry. The only container that ever sees more than one raw
    # agent key; no agent key is committed anywhere in the repository.
    user: "0:0"
    network_mode: none
    command:
      - "python"
      - "-m"
      - "gateway.agent_provisioning"
      - "--registry"
      - "/registry/agent_credentials.json"
      - "--tenant-id"
      - "pilot"
      - "--owner"
      - "10005:10005"
      - "--agent"
      - "agent/notify-bot=/creds/notify-bot"
      - "--agent"
      - "agent/unknown=/creds/unknown"
    volumes:
      - agent-registry:/registry
      - agent-cred-notify-bot:/creds/notify-bot
      - agent-cred-unknown:/creds/unknown

  mcc-gateway:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MCC_GATEWAY_API_KEY: "demo-key"
      MCC_GATEWAY_OPERATOR_API_KEY: "op-key"
      # Independent authority-side policy (PROPOSAL != PERMISSION): an
      # authenticated operator key alone no longer suffices to grant an
      # ESCALATE approval -- this exact, independently configured policy
      # must also ALLOW the operation. Set only here (mcc-gateway); neither
      # reference-agent nor reference-agent-operator reads or supplies this
      # file.
      MCC_AUTHORITY_POLICY_CONFIG: "/app/authority_policy.notify.json"
      # V05 (part 2): the per-agent credential registry -- SHA-256 hashes only,
      # written by agent-credentials-init into the read-only agent-registry
      # volume. The gateway never sees a raw agent key.
      MCC_AGENT_CREDENTIALS_CONFIG: "/registry/agent_credentials.json"
      MCC_GATEWAY_MODE: "inline"
      MCC_GATEWAY_AUDIT_LOG_PATH: "/data/audit.jsonl"
      # The governed executor: perform the outbound call and require a confirmed,
      # matching receipt before EXECUTED.
      MCC_UPSTREAM_BASE: "http://mock-notification:9200"
      MCC_UPSTREAM_RECEIPT_VERIFY: "1"
      # Redis-backed state (no in-memory fallback; fail closed if Redis is down).
      MCC_REDIS_URL: "redis://redis:6379/0"
      MCC_NONCE_BACKEND: "redis"
      MCC_IDEMPOTENCY_BACKEND: "redis"
      MCC_VELOCITY_BACKEND: "redis"
      MCC_APPROVAL_BACKEND: "redis"
      MCC_CHALLENGE_BACKEND: "redis"
      # Clock-skew hardening (PR #122): resolve `now` for approval/mandate/
      # gate validity checks from this SAME shared, validated Redis clock
      # rather than each gateway instance's own local clock.
      MCC_TIME_TRUST_BACKEND: "redis"
    networks: [agent_edge, gov_internal]
    volumes:
      - agent-registry:/registry:ro
      - refagent-audit:/data
    depends_on:
      agent-credentials-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  reference-agent:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    command: ["python", "/app/reference_agent_runner.py"]
    # Authority principal separation: no operator key here. This container
    # cannot self-approve its own ESCALATE even if its own code were
    # compromised -- only reference-agent-operator (a separate container,
    # separate credential) can grant an approval.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8001"
      # V05 (part 2): this container IS one principal. It receives ONLY its own
      # provisioned credential (read-only volume) -- never the provisioning
      # map, the tenant's shared key, another agent's key or the operator key.
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - refagent-pilot-state:/pilot-state
      - agent-cred-notify-bot:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy

  # V05 (part 2): agent/unknown is a DIFFERENT principal (its ESCALATE has no
  # notify.send mandate), so it runs in its OWN container with its OWN
  # credential volume -- the two agents never share a key.
  reference-agent-escalate:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    command: ["python", "/app/reference_agent_runner.py"]
    # Authority principal separation: no operator key here. This container
    # cannot self-approve its own ESCALATE even if its own code were
    # compromised -- only reference-agent-operator (a separate container,
    # separate credential) can grant an approval.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8001"
      # V05 (part 2): this container IS one principal. It receives ONLY its own
      # provisioned credential (read-only volume) -- never the provisioning
      # map, the tenant's shared key, another agent's key or the operator key.
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - refagent-pilot-state:/pilot-state
      - agent-cred-unknown:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy

  reference-agent-operator:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.reference-agent
    command: ["python", "/app/gateway_approval_operator.py"]
    # Authority principal separation: holds ONLY the operator key. No
    # MCC_GATEWAY_API_KEY here -- this process grants approvals; it never
    # calls /approvals/{id}/execute, so it cannot actuate anything on the
    # agent's behalf even if compromised (AUTHORITY_CREDENTIALS ∩
    # EXECUTION_CREDENTIALS = ∅). reference-agent performs its own execute
    # call with its own key once a mandate is granted.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8001"
      MCC_GATEWAY_OPERATOR_API_KEY: "op-key"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - refagent-pilot-state:/pilot-state
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy

volumes:
  agent-registry:
  agent-cred-notify-bot:
  agent-cred-unknown:
  refagent-audit:
  refagent-pilot-state:
