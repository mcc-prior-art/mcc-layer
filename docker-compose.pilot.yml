# MCC-Core Governed Agent Pilot — full stack in one command.
#
#   docker compose -f docker-compose.pilot.yml up --build
#   docker compose -f docker-compose.pilot.yml run --rm mcc-agent \
#       python /app/governed_agent_compose_demo.py
#
# Services:
#   redis         — Redis-backed nonce/idempotency/velocity/approval state.
#   pilot-api     — the EXTERNAL enterprise API the agent acts upon.
#   mcc-gateway   — the MCC-Core governed gateway (the egress proxy): authority +
#                   execution gate + governed HTTPS executor + audit. The ONLY
#                   service that performs the outbound call to pilot-api.
#   agent-credentials-init — one-shot, network-less provisioning (F1b): one
#                   credential per agent principal + the gateway's hash-only registry.
#   mcc-agent     — the governed agent runner as agent/crm: proposes + submits
#                   to mcc-gateway. Holds ONLY its own credential -- no operator key.
#   mcc-agent-escalate — the same runner as agent/intern (ESCALATE path), in its
#                   own container with its own credential.
#   mcc-operator  — SEPARATE process/container/credential holder from
#                   mcc-agent. Holds ONLY the operator key. Watches a shared,
#                   non-secret state file (the pending approval's request_id)
#                   and grants the approval; it never executes anything
#                   itself (no agent api key, no /v1/http/execute route used).
#                   See governed_agent_pilot_operator.py.
#
# Authority principal separation: AGENT_CREDENTIALS ∩ AUTHORITY_CREDENTIALS = ∅.
# mcc-agent cannot self-approve its own ESCALATE (it has no operator key, even
# if its own code were compromised); mcc-operator cannot execute anything on
# the agent's behalf (it has no agent api key). Compromising one does not
# imply compromising the other.
#
# Network boundary (a PILOT boundary — see "production hardening" in
# docs/MCC_CORE_PILOT_V0_1.md): production isolation additionally requires
# network policies, service identity, and workload isolation.
#   * agent_edge   — mcc-agent, mcc-operator <-> mcc-gateway only (they do not
#                    talk to each other; both only reach the gateway).
#   * gov_internal — mcc-gateway <-> pilot-api <-> redis. mcc-agent and
#                    mcc-operator are NOT here, so neither has a
#                    governed-bypass route to the external API.
networks:
  agent_edge:
  gov_internal:

volumes:
  mcc-agent-audit:
  mcc-pilot-state:
  # F1b: hash-only registry (gateway, ro) + one credential volume per agent.
  agent-registry:
  agent-cred-crm:
  agent-cred-intern:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pilot-api:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    command: ["uvicorn", "pilot_api.app:app", "--host", "0.0.0.0", "--port", "9100"]
    networks: [gov_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-credentials-init:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    # F1b -- TRUSTED PROVISIONING BOUNDARY (one-shot, no network). A fresh
    # random credential per agent into THAT agent's own volume, and the
    # gateway's registry (SHA-256 hashes only). No agent key is committed.
    user: "0:0"
    network_mode: none
    command:
      - "python"
      - "-m"
      - "gateway.agent_provisioning"
      - "--registry"
      - "/registry/agent_credentials.json"
      - "--tenant-id"
      - "governed-agent-demo"
      - "--owner"
      - "10003:10003"
      - "--agent"
      - "agent/crm=/creds/crm"
      - "--agent"
      - "agent/intern=/creds/intern"
    volumes:
      - agent-registry:/registry
      - agent-cred-crm:/creds/crm
      - agent-cred-intern:/creds/intern

  mcc-gateway:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    command: ["uvicorn", "egress_proxy.app:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      # Governed gateway config (the verdict comes from MCC-Core authority).
      # F1b: the service key asserts no actor (strict mode); each agent is
      # resolved from its OWN credential via the hash-only registry and its
      # ``actor`` must equal that principal.
      MCC_EGRESS_API_KEY: "agent-key"
      MCC_AGENT_CREDENTIALS_CONFIG: "/registry/agent_credentials.json"
      MCC_EGRESS_TENANT_ID: "governed-agent-demo"
      MCC_EGRESS_OPERATOR_API_KEY: "op-key"
      # Independent authority-side policy (PROPOSAL != PERMISSION): an
      # authenticated operator key alone no longer suffices to grant an
      # ESCALATE approval -- this exact, independently configured policy
      # must also ALLOW the operation. Set only here (mcc-gateway); neither
      # mcc-agent nor mcc-operator reads or supplies this file.
      MCC_EGRESS_AUTHORITY_POLICY_CONFIG: "/app/authority_policy.egress.json"
      MCC_EGRESS_EGRESS_ACTOR_MANDATE: "agent/crm"
      MCC_EGRESS_ALLOWED_HOSTS: "pilot-api"
      MCC_EGRESS_ALLOWED_METHODS: "get,post"
      MCC_EGRESS_MAX_AMOUNT: "5000"
      MCC_EGRESS_ALLOW_LOOPBACK: "false"
      MCC_EGRESS_ALLOW_PRIVATE: "true"       # pilot-api is on a private Docker network
      MCC_EGRESS_REQUIRE_HTTPS: "false"      # pilot-only: plain HTTP on the internal net
      MCC_EGRESS_ALLOW_HTTP: "true"
      MCC_EGRESS_REQUIRE_CONSENSUS: "false"
      MCC_EGRESS_AUDIT_LOG_PATH: "/data/egress-audit.jsonl"
      # Redis-backed state (no in-memory fallback; fail closed if Redis is down).
      MCC_REDIS_URL: "redis://redis:6379/0"
      MCC_NONCE_BACKEND: "redis"
      MCC_IDEMPOTENCY_BACKEND: "redis"
      MCC_VELOCITY_BACKEND: "redis"
      MCC_APPROVAL_BACKEND: "redis"
      # Clock-skew hardening (PR #122): resolve `now` for approval/mandate/
      # gate validity checks from this SAME shared, validated Redis clock
      # rather than each gateway instance's own local clock.
      MCC_TIME_TRUST_BACKEND: "redis"
    networks: [agent_edge, gov_internal]
    volumes:
      - mcc-agent-audit:/data
      - agent-registry:/registry:ro
    depends_on:
      agent-credentials-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pilot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/livez').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcc-agent:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    command: ["python", "/app/governed_agent_compose_demo.py"]
    # Authority principal separation: no operator key here. This container
    # cannot self-approve its own ESCALATE even if its own code were
    # compromised -- only mcc-operator (a separate container, separate
    # credential) can grant an approval.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8090"
      PILOT_API_BASE: "http://pilot-api:9100"
      # F1b: this container IS agent/crm. It holds ONLY its own credential
      # (read-only volume) -- no service key, operator key or other agent key.
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_EGRESS_EGRESS_ACTOR_MANDATE: "agent/crm"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - mcc-pilot-state:/pilot-state
      - agent-cred-crm:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy

  # F1b: agent/intern is a DIFFERENT principal (no mandate -> ESCALATE), so it
  # runs in its OWN container with its OWN credential volume.
  mcc-agent-escalate:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    command: ["python", "/app/governed_agent_compose_demo.py"]
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8090"
      PILOT_API_BASE: "http://pilot-api:9100"
      MCC_AGENT_CREDENTIAL_FILE: "/run/mcc-agent/credential.json"
      MCC_EGRESS_EGRESS_ACTOR_MANDATE: "agent/crm"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - mcc-pilot-state:/pilot-state
      - agent-cred-intern:/run/mcc-agent:ro
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy

  mcc-operator:
    build:
      context: .
      dockerfile: deploy/pilot/Dockerfile.agent-pilot
    command: ["python", "/app/governed_agent_pilot_operator.py"]
    # Authority principal separation: holds ONLY the operator key. No
    # MCC_EGRESS_API_KEY here -- this process grants approvals; it never
    # calls /v1/http/execute, so it cannot actuate anything on the agent's
    # behalf even if compromised.
    environment:
      MCC_GATEWAY_URL: "http://mcc-gateway:8090"
      MCC_EGRESS_OPERATOR_API_KEY: "op-key"
      MCC_PILOT_STATE_DIR: "/pilot-state"
    volumes:
      - mcc-pilot-state:/pilot-state
    networks: [agent_edge]
    depends_on:
      mcc-gateway:
        condition: service_healthy
